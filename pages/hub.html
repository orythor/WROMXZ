<div class="hub-header">
            <div>
                <h2>Prompt Hub</h2>
                <p>Sumua prompt tinggal salin atau download</p>
            </div>
        </div>

        <!-- BANNER IMAGE -->
        <div class="hub-banner">
            <img src="https://files.catbox.moe/edid13.jpg" alt="NOVAPROMPT Banner"
                 loading="lazy" decoding="async"
                 onerror="this.parentElement.style.display='none'">
        </div>

        <div class="search-wrap">
            <svg class="search-icon-pos" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input" id="search-input" placeholder="Cari blueprint prompt secara instan...">
        </div>

        <div class="prompt-grid" id="prompt-grid">
            <div class="state-box">
                <div class="spinner"></div>
                <p>Memuat prompts dari database...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination-wrap" style="display:none;"></div>
