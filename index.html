<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVAHUB</title>

    <!-- Security Meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="assets/nova.css">
    <script src="assets/nova-security.js"></script>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="logo-wrap">
            <svg width="12" height="12" viewBox="0 0 64 64" fill="white">
                <path d="M32 4C32 18 18 32 4 32C18 32 32 46 32 60C32 46 46 32 60 32C46 32 32 18 32 4Z"/>
            </svg>
            <span class="logo-text">Novaprompt</span>
        </div>
        <button class="close-btn" id="close-sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <div>
        <p class="sidebar-section-label" style="margin-bottom: 0.75rem;">Navigation</p>
        <div class="sidebar-nav">
            <div class="nav-item active" data-page="dashboard">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                Dashboard
            </div>
            <div class="nav-item" data-page="hub">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                Prompt Hub
            </div>

            <p class="sidebar-section-label" style="margin:1.1rem 0 0.5rem;">Tools</p>
            <div class="nav-item" data-page="host-info">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                Host Info
            </div>
            <div class="nav-item" data-page="anime-news">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
                Berita Anime
            </div>
            <div class="nav-item" data-page="qr-gen">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="5" y="5" width="3" height="3" fill="currentColor" stroke="none"/><rect x="16" y="5" width="3" height="3" fill="currentColor" stroke="none"/><rect x="16" y="16" width="3" height="3" fill="currentColor" stroke="none"/><rect x="5" y="16" width="3" height="3" fill="currentColor" stroke="none"/></svg>
                QR Generator
            </div>

            <p class="sidebar-section-label" style="margin:1.1rem 0 0.5rem;">Lainnya</p>
            <div class="nav-item" data-page="cipherx">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l9 4.9v9.2L12 22l-9-4.9V6.9L12 2z"/></svg>
                CipherX
            </div>
        </div>
    </div>

    <div class="sidebar-footer">
        <p>2026-2027 ©AXv</p>
    </div>
</nav>

<!-- HEADER -->
<header>
    <button class="menu-btn" id="open-sidebar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
    </button>
    <div class="logo-wrap">
        <svg class="logo-mark" width="13" height="13" viewBox="0 0 64 64" fill="currentColor">
            <path d="M32 4C32 18 18 32 4 32C18 32 32 46 32 60C32 46 46 32 60 32C46 32 32 18 32 4Z"/>
        </svg>
        <span class="logo-text">NOVAPROMPT</span>
    </div>
    <div class="header-spacer"></div>
</header>

<!-- PROMPT VIEW MODAL -->
<div class="modal-overlay" id="view-modal">
    <div class="modal-box">
        <div class="modal-head">
            <div class="modal-head-left">
                <span class="modal-title" id="modal-title">Blueprint</span>
                <span class="modal-subtitle" id="modal-tag-label">Category</span>
            </div>
            <button class="close-btn" id="close-view-modal">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="modal-prompt-text" id="modal-body"></div>
        </div>
        <div class="modal-foot">
            <button class="action-btn copy" id="modal-copy-btn">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                Salin Prompt
            </button>
            <button class="action-btn" id="modal-download-btn">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download .txt
            </button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
    <span class="toast-dot"></span>
    <span id="toast-msg"></span>
</div>

<!-- MAIN — konten halaman di-inject ke sini -->
<main>
    <div id="page-content" class="page active">
        <!-- Loading state saat fetch -->
        <div class="page-loading" id="page-loading" style="display:none;">
            <div class="spinner"></div>
        </div>
    </div>
</main>

<!-- Core JS — canvas, sidebar, routing, toast, supabase -->
<script src="assets/nova-core.js" defer></script>

</body>
</html>
